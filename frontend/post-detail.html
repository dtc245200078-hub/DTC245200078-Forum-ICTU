<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chi tiết bài viết - Forum ICTU</title>
  <link rel="stylesheet" href="/css/theme.css">

  <style>
    .detail-container {
      display: block;
      max-width: 950px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .detail-card {
      background: white;
      padding: 35px;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      margin-bottom: 25px;
      box-shadow: 0 10px 30px #1e3a8a10;
    }

    .detail-title {
      font-size: 32px;
      line-height: 1.35;
      color: #172554;
      margin: 15px 0;
    }

    .detail-meta {
      color: #64748b;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .detail-content {
      white-space: pre-wrap;
      line-height: 1.9;
      color: #334155;
      font-size: 16px;
      overflow-wrap: anywhere;
    }

    .comment {
      padding: 20px 0;
      border-bottom: 1px solid #e2e8f0;
    }

    .comment:last-child {
      border-bottom: 0;
    }

    .comment-author {
      color: #1d4ed8;
      font-weight: bold;
    }

    .comment-date {
      color: #94a3b8;
      font-size: 12px;
      margin-left: 10px;
    }

    .comment-content {
      color: #334155;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .comment-form textarea {
      width: 100%;
      min-height: 120px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 14px;
      font: inherit;
      resize: vertical;
      margin-bottom: 15px;
    }

    .primary-btn {
      background: #2563eb;
      color: white;
      padding: 12px 22px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary-btn:hover {
      background: #1d4ed8;
    }

    .primary-btn:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    .message {
      margin-bottom: 15px;
      color: #64748b;
    }

    @media (max-width: 600px) {
      .detail-card {
        padding: 22px;
      }

      .detail-title {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="top">
      <div class="logo">Forum ICTU</div>

      <nav>
        <a href="/">Trang chủ</a>
        <a href="/create-post.html">+ Tạo bài viết</a>
        <a href="/account.html">Đăng nhập / Đăng ký</a>
      </nav>
    </div>
  </header>

  <main class="detail-container">
    <a href="/" class="back-link">← Quay về diễn đàn</a>

    <article class="detail-card">
      <span id="postCategory" class="badge">Đang tải...</span>

      <h1 id="postTitle" class="detail-title">
        Đang tải bài viết...
      </h1>

      <div id="postMeta" class="detail-meta"></div>

      <div id="postContent" class="detail-content"></div>
      <div id="postActions" style="margin-top:25px;display:flex;gap:10px;"></div>
    </article>

    <section class="detail-card">
      <h2>Bình luận</h2>
      <div id="commentsList">Đang tải bình luận...</div>
    </section>

    <section class="detail-card">
      <h2>Viết bình luận</h2>

      <p id="commentMessage" class="message"></p>

      <form id="commentForm" class="comment-form">
        <textarea
          id="commentContent"
          placeholder="Chia sẻ ý kiến của bạn..."
          minlength="2"
          maxlength="5000"
          required
        ></textarea>

        <button id="commentSubmit" class="primary-btn" type="submit">
          Gửi bình luận
        </button>
      </form>
    </section>
  </main>

  <script src="/js/post-detail.js"></script>
  <script src="/js/header.js"></script>
</body>
</html>
